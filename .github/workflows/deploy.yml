# =============================================================================
# deploy.yml — flora64 deployment pipeline
#
# Triggers: push to main or manual workflow_dispatch
#
# Builds:
#   1. Zig WASM binary  → www/public/flora64_merge.wasm
#   2. Vite static site → www/dist/
#
# Deploys:
#   - Uploads www/dist/ as a GitHub Pages artifact
#   - Deploys to GitHub Pages
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:         # allow manual trigger from the Actions tab

env:
  ZIG_VERSION: 0.16.0
  NODE_VERSION: 22

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Grant GITHUB_TOKEN the permissions required for GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ---- Checkout -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Zig -------------------------------------------------------------
      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build WASM binary
        run: zig build
        # Produces www/public/flora64_merge.wasm

      # ---- Node.js / Vite --------------------------------------------------
      - name: Install Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: www

      - name: Build frontend
        run: npm run build
        working-directory: www
        # Produces www/dist/

      # ---- GitHub Pages ----------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
